# Builds the Linux release and publishes it to GitHub Releases when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# Tags with a hyphen (e.g. v1.0.0-rc1) are published as pre-releases, which update.sh only installs
# when asked for by name (./update.sh --version v1.0.0-rc1).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish SlopSniper/SlopSniper.csproj -p:PublishProfile=linux-x64 -p:Version="$VERSION"

      - name: Package
        run: |
          mkdir staging
          cp SlopSniper/bin/Release/publish/linux-x64/SlopSniper staging/
          cp SlopSniper/config.example.json staging/
          cp deploy/install.sh deploy/update.sh deploy/slop-sniper.service.template staging/
          echo "$VERSION" > staging/VERSION
          chmod +x staging/SlopSniper staging/install.sh staging/update.sh
          tar -czf slop-sniper-linux-x64.tar.gz -C staging .
          sha256sum slop-sniper-linux-x64.tar.gz > slop-sniper-linux-x64.tar.gz.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            slop-sniper-linux-x64.tar.gz slop-sniper-linux-x64.tar.gz.sha256 \
            --generate-notes $prerelease
